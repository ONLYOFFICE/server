name: Config schema check
on:
  push:
    branches:
      - '**'
    paths:
      - 'Common/config/default.json'
      - 'Common/config/schemas/config.schema.json'
      - 'scripts/check-config-schema.js'
      - '.github/workflows/config-schema-check.yml'

jobs:
  config-schema-check:
    name: Config schema check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Caching dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run config schema check
        run: npm run config-schema:check
